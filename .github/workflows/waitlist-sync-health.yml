name: Waitlist sync health

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check waitlist sync is not stale
        run: |
          curl -fsS -X GET "$CARSPOTTER_API_URL/api/internal/waitlist/health" \
               -H "X-Cron-Secret: $CRON_SECRET"
        env:
          CARSPOTTER_API_URL: ${{ secrets.CARSPOTTER_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
