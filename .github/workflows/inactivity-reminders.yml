name: Inactivity reminders

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  inactivity:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger inactivity reminders
        run: |
          curl -fsS -X POST "$CARSPOTTER_API_URL/api/internal/notifications/inactivity" \
               -H "X-Cron-Secret: $CRON_SECRET"
        env:
          CARSPOTTER_API_URL: ${{ secrets.CARSPOTTER_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
