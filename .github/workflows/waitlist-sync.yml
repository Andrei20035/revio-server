name: Waitlist sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger waitlist reconciliation
        run: |
          curl -fsS -X POST "$CARSPOTTER_API_URL/api/internal/waitlist/sync" \
               -H "X-Cron-Secret: $CRON_SECRET"
        env:
          CARSPOTTER_API_URL: ${{ secrets.CARSPOTTER_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
