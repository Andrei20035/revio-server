name: Challenge start notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  challenge-start:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger challenge-start notifications
        run: |
          curl -fsS -X POST "$CARSPOTTER_API_URL/api/internal/notifications/challenge-start" \
               -H "X-Cron-Secret: $CRON_SECRET"
        env:
          CARSPOTTER_API_URL: ${{ secrets.CARSPOTTER_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
