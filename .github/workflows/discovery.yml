name: Discovery notifications

on:
  schedule:
    - cron: "0 9 * * 1,3,5"
  workflow_dispatch: {}

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger discovery notifications
        run: |
          curl -fsS -X POST "$CARSPOTTER_API_URL/api/internal/notifications/discovery" \
               -H "X-Cron-Secret: $CRON_SECRET"
        env:
          CARSPOTTER_API_URL: ${{ secrets.CARSPOTTER_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
