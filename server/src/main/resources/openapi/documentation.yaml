openapi: 3.0.3
info:
  title: Revio API
  description: >
    REST API for the Revio application (Ktor backend). All endpoints are mounted under `/api`.

    Authentication uses JWT bearer access tokens. Access tokens carry session claims
    (`sid`, `ver`, `credentialId`, `userId`, `email`) and are validated against the active
    session on every request; a revoked or superseded session fails validation even when the
    token signature is still valid. Auth failures return a machine-readable error code
    (see `AuthErrorResponse`) that the Android client uses to drive token refresh.

    Sessions have two scopes: `ONBOARDING` (credentials exist, no user profile yet) and
    `FULL` (profile created). Endpoints requiring a `userId` claim are only usable with a
    `FULL`-scope token.
  version: 2.0.0
servers:
  - url: /api
    description: Main API server

tags:
  - name: Authentication
    description: Registration, login, token refresh, sessions, password and account deletion
  - name: Users
    description: User profile creation, self profile, public profiles, profile picture
  - name: Posts
    description: Feed, post detail, create/update/delete posts
  - name: Comments
    description: Post comments
  - name: Likes
    description: Post like status and toggling
  - name: Reports
    description: Post reporting
  - name: User Cars
    description: The single car owned by a user profile
  - name: Car Models
    description: Car brand and model catalogue
  - name: Car Families
    description: Groupings of car models (e.g. all Volkswagen Golf variants) used to target challenges
  - name: Challenges
    description: Weekend-style challenges — spot N cars from a family within a window to earn a reward
  - name: Friends
    description: Friendships
  - name: Friend Requests
    description: Pending friend requests
  - name: Leaderboard
    description: Spot-score leaderboard
  - name: Activity
    description: Activity feed for the current user
  - name: Feedback
    description: In-app feedback (bug reports, confusion, feature ideas, general feedback)
  - name: Admin
    description: Operator and cron endpoints (separate header-based secrets, not JWT)

paths:
  # ---------------------------------------------------------------- Authentication
  /auth/register:
    post:
      summary: Register new credentials
      description: >
        Creates auth credentials and returns an `ONBOARDING`-scope session. The caller must
        then create a user profile via `POST /users` to be promoted to `FULL` scope.
        For `provider: GOOGLE`, `googleIdToken` is required and the email is taken from the
        verified Google token; for `provider: REGULAR`, `email` and `password` are required.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Credentials created; onboarding session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error or weak password (`VALIDATION_ERROR`, `WEAK_PASSWORD`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: Invalid Google token (`INVALID_GOOGLE_TOKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: Email already registered (`EMAIL_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/login:
    post:
      summary: Log in
      description: >
        Authenticates with email/password or a Google ID token. The returned session scope is
        `ONBOARDING` when no user profile exists yet, otherwise `FULL`.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: Invalid credentials (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: Account uses a different sign-in provider (`PROVIDER_MISMATCH`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh tokens
      description: >
        Exchanges a refresh token for a new access token and a rotated refresh token.
        Refresh tokens are single-use; replaying a consumed token revokes the session
        (`REFRESH_TOKEN_REUSED`).
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing refresh token (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: >
            Refresh failed. Codes: `REFRESH_TOKEN_INVALID`, `REFRESH_TOKEN_EXPIRED`,
            `REFRESH_TOKEN_REUSED`, `REFRESH_TOKEN_CONSUMED`, `SESSION_REVOKED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/logout:
    post:
      summary: Log out current session
      description: Revokes the session identified by the `sid` claim of the access token.
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /auth/logout-all:
    post:
      summary: Log out all sessions
      description: Revokes every active session for the credential.
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: All sessions revoked
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /auth/sessions:
    get:
      summary: List active sessions
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: >
            Active sessions for the credential; the calling session is flagged with
            `current: true`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionDTO'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /auth/account/deletion-context:
    get:
      summary: Account deletion context
      description: >
        Stats shown on the delete-account confirmation screen. `provider` tells the client
        whether a password confirmation is required (`REGULAR`) or a username confirmation
        (`GOOGLE`). Requires a `FULL`-scope token.
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Deletion context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionContextDTO'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Account not found (`ACCOUNT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/account:
    delete:
      summary: Delete account
      description: >
        Permanently deletes the account. `REGULAR` accounts must supply `password`;
        `GOOGLE` accounts must supply `usernameConfirmation`. `reason`/`details` are optional
        feedback.
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >
            Missing body or failed confirmation (`VALIDATION_ERROR`,
            `INVALID_CURRENT_PASSWORD`, `USERNAME_CONFIRMATION_MISMATCH`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /auth/password:
    put:
      summary: Change password
      description: >
        Only valid for `REGULAR` credentials. On success the current session's tokens are
        rotated and a fresh token pair is returned, so the client must replace its stored
        tokens.
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: Password updated; rotated token pair returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: >
            `VALIDATION_ERROR`, `WEAK_PASSWORD`, `INVALID_CURRENT_PASSWORD`,
            or `PROVIDER_NOT_REGULAR`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Credentials not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------- Users
  /users:
    post:
      summary: Create user profile (finish onboarding)
      description: >
        Creates the user profile for the authenticated credential and promotes the current
        `ONBOARDING` session to `FULL`. Returns a new token pair carrying the `userId` claim.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Profile created; promoted token pair returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '409':
          description: Username already taken, or a profile already exists for this credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      summary: Get own profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Own profile, including per-field change eligibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfUserDTO'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update own profile
      description: >
        Partial update. `fullName`, `country` and `birthDate` may each be changed only once
        ever; `username` and `phoneNumber` are rate-limited to one change per cooldown
        window. Violations return 403 with a `ProfileErrorCode`.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfUserDTO'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Change not currently allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Username or phone number already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/profile-picture:
    patch:
      summary: Update profile picture
      description: >
        Accepts either `multipart/form-data` with an `image` file part (max 10 MiB;
        `image/jpeg`, `image/png`, `image/webp`), which the server uploads to storage itself,
        or `application/json` with an already-uploaded `imagePath`.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file, max 10485760 bytes
              required: [image]
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfilePictureRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfUserDTO'
        '400':
          description: Missing image, oversized image, or unsupported content type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/username-available:
    get:
      summary: Check username availability
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailabilityResponse'
        '400':
          description: Missing username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /users/{userId}:
    get:
      summary: Get public profile
      description: Public endpoint; no authentication required.
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          description: Invalid userId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Posts
  /posts/feed:
    get:
      summary: Global feed
      description: >
        Keyset-paginated feed, newest first. Authentication is optional: with a valid bearer
        token, `likedByCurrentUser` reflects the viewer. A malformed, expired or revoked
        token is rejected with 401 rather than treated as anonymous. Pass both
        `cursorCreatedAt` and `cursorPostId` from `nextCursor` to fetch the next page.
      tags: [Posts]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursorCreatedAt
          in: query
          description: ISO-8601 instant from `nextCursor.lastCreatedAt`
          schema:
            type: string
            format: date-time
        - name: cursorPostId
          in: query
          description: UUID from `nextCursor.lastPostId`
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponseDTO'
        '400':
          description: Invalid limit or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /users/{userId}/posts:
    get:
      summary: Posts by user
      description: Same keyset pagination and optional-auth semantics as `/posts/feed`.
      tags: [Posts]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursorCreatedAt
          in: query
          schema:
            type: string
            format: date-time
        - name: cursorPostId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page of the user's posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponseDTO'
        '400':
          description: Invalid userId, limit or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /posts:
    post:
      summary: Create post
      description: >
        `multipart/form-data` with a JSON `metadata` part (`CreatePostMetadata`) and an
        `image` file part (max 10 MiB). Either `carModelId` or the
        `customBrand`/`customModel` pair identifies the car.
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata:
                  $ref: '#/components/schemas/CreatePostMetadata'
                image:
                  type: string
                  format: binary
                  description: Image file, max 10485760 bytes
              required: [metadata, image]
            encoding:
              metadata:
                contentType: application/json
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                type: object
                properties:
                  postId:
                    type: string
                    format: uuid
                  user:
                    allOf:
                      - $ref: '#/components/schemas/SelfUserDTO'
                    nullable: true
                required: [postId]
        '400':
          description: Missing/invalid metadata, missing image, or image too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          description: Failed to create post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts/{postId}:
    get:
      summary: Get post by id
      description: Public endpoint; no authentication required.
      tags: [Posts]
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDTO'
        '400':
          description: Invalid postId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update own post
      description: Author only. Updates the car identification and/or caption.
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Updated post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDTO'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Not the author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The post's car identification (carModelId/customBrand/customModel) can no longer be
            changed because the post has contributed to a challenge. The caption may still be
            updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [CHALLENGE_POST_VEHICLE_LOCKED]
                required: [error, code]
    delete:
      summary: Delete own post
      description: Author only.
      tags: [Posts]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '204':
          description: Post deleted
        '400':
          description: Invalid postId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Not the author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Comments
  /posts/{postId}/comments:
    get:
      summary: List comments for a post
      description: >
        Public endpoint. An empty list is a valid 200 response; post existence is not
        verified.
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Comments, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentDTO'
        '400':
          description: Invalid postId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Add comment
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDTO'
        '400':
          description: Invalid postId or comment text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /comments/{commentId}:
    delete:
      summary: Delete own comment
      tags: [Comments]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Comment deleted
        '400':
          description: Invalid commentId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Not the comment author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------- Likes
  /posts/{postId}/likes:
    get:
      summary: Get like status
      description: >
        Authentication is optional. Without a token `liked` is always `false`; with a valid
        token it reflects the caller.
      tags: [Likes]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Like status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeStatusDTO'
        '400':
          description: Invalid postId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Toggle like
      description: Likes the post if not already liked, otherwise unlikes it.
      tags: [Likes]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Resulting like status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeStatusDTO'
        '400':
          description: Invalid postId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------- Reports
  /posts/{postId}/reports:
    post:
      summary: Report post
      description: >
        One report per user/post/reason; a repeat report is accepted as an idempotent no-op
        and returns 200 with `status: already_reported`.
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequestDTO'
      responses:
        '201':
          description: Report recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportStatusResponse'
        '200':
          description: Already reported (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportStatusResponse'
        '400':
          description: Invalid postId or reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------- Challenges
  /challenges/current:
    get:
      summary: Current or next-upcoming challenge
      description: >
        The SCHEDULED challenge active right now, or if none is active, the soonest upcoming
        one. `challenge`/`progress` are both `null` when no challenge is scheduled at all.
        `progress` reflects the caller's own contributions (zero/`NONE` if they haven't
        contributed yet). All instants are UTC; the client converts to the viewer's timezone.
      tags: [Challenges]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current challenge and the caller's progress on it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentChallengeDTO'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /challenges/me:
    get:
      summary: Caller's challenge history and lifetime summary
      description: >
        Keyset-paginated history of challenges the caller has participated in (has at least one
        contribution to), newest-finished first. `summary` is present only on the first page
        (no cursor given) — recomputing it on every subsequent page would be wasted work the
        client already has the answer for. A user with no history gets `200` with an empty
        `challenges` array and a zeroed summary, never `404`.
      tags: [Challenges]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          description: 1-50, default 20 (or when 0/omitted).
        - name: cursorEndsAt
          in: query
          schema:
            type: string
            format: date-time
          description: Must be given together with cursorId, both taken from the previous page's nextCursor* fields.
        - name: cursorId
          in: query
          schema:
            type: string
            format: uuid
        - name: filter
          in: query
          schema:
            type: string
            enum: [completed, not_completed]
      responses:
        '200':
          description: The caller's challenge history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyChallengesDTO'
        '400':
          description: Invalid limit, cursor, or filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /challenges/{id}:
    get:
      summary: Public config of one challenge
      description: >
        A single challenge's public-facing config, for opening a challenge's detail from the
        caller's own history or from the Feed's active-challenge card. A `DRAFT` challenge (never
        published) 404s here, the same as one that doesn't exist at all — only admin routes can
        see a `DRAFT` challenge.
      tags: [Challenges]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The challenge's public config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeDTO'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Challenge not found, or DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /challenges/{id}/progress:
    get:
      summary: Caller's progress on a challenge
      description: >
        The caller's own progress and contributing posts for any existing challenge (not
        limited to the currently active one), so a user can look back at a past challenge.
        Zero progress is returned (not 404) when the caller has no contributions.
      tags: [Challenges]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Progress detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeProgressDetailDTO'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------- User cars
  /me/car:
    get:
      summary: Get own car
      tags: [User Cars]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Own car
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCarDTO'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: User car not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create own car
      description: >
        `multipart/form-data` with a required JSON `metadata` part (`UserCarRequest`) and a
        required `image` file part (max 10 MiB). A user profile may own at most one car.
      tags: [User Cars]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata:
                  $ref: '#/components/schemas/UserCarRequest'
                image:
                  type: string
                  format: binary
                  description: Image file, max 10485760 bytes
              required: [metadata, image]
            encoding:
              metadata:
                contentType: application/json
      responses:
        '201':
          description: Car created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCarDTO'
        '400':
          description: Missing/invalid metadata or image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '409':
          description: User already has a car
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create user car
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update own car
      description: >
        `multipart/form-data`; both parts are optional. Send `metadata`
        (`UserCarUpdateRequest`) to change the car identification and/or `image` to replace
        the photo.
      tags: [User Cars]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata:
                  $ref: '#/components/schemas/UserCarUpdateRequest'
                image:
                  type: string
                  format: binary
                  description: Image file, max 10485760 bytes
            encoding:
              metadata:
                contentType: application/json
      responses:
        '200':
          description: Updated car
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCarDTO'
        '400':
          description: Invalid metadata or image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: User car not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to update user car
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete own car
      tags: [User Cars]
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Car deleted
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: User car not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}/car:
    get:
      summary: Get another user's car
      description: Public endpoint; no authentication required.
      tags: [User Cars]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: The user's car
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCarDTO'
        '400':
          description: Invalid userId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User car not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------- Car models
  /car-models/brands:
    get:
      summary: List car brands
      description: Public endpoint; no authentication required.
      tags: [Car Models]
      responses:
        '200':
          description: Brand names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /car-models/brands/{brand}/models:
    get:
      summary: List models for a brand
      description: Public endpoint; no authentication required.
      tags: [Car Models]
      parameters:
        - name: brand
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Models for the brand
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarModelOption'
        '400':
          description: Missing brand parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------- Friends
  /friends:
    get:
      summary: List own friends
      description: Returns 204 with no body when the user has no friends.
      tags: [Friends]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Friendships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendDTO'
        '204':
          description: No friends
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /friends/admin:
    get:
      summary: List all friendships (admin)
      description: Requires a JWT with the `isAdmin` claim.
      tags: [Friends, Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All friendships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendDTO'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /friends/{friendId}:
    post:
      summary: Add friend
      tags: [Friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Friend added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid friendId, or attempting to add yourself
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '409':
          description: Friendship already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove friend
      tags: [Friends]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Friend deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid friendId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Friendship does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------- Friend requests
  /friend-requests:
    get:
      summary: List incoming friend requests
      description: Returns 204 with no body when there are none.
      tags: [Friend Requests]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Friend requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendRequestDTO'
        '204':
          description: No friend requests
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /friend-requests/admin:
    get:
      summary: List all friend requests (admin)
      description: Requires a JWT with the `isAdmin` claim.
      tags: [Friend Requests, Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All friend requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendRequestDTO'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /friend-requests/{receiverId}:
    post:
      summary: Send friend request
      tags: [Friend Requests]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: receiverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Friend request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid receiverId, or sending a request to yourself
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '500':
          description: A problem occurred when sending the friend request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /friend-requests/{senderId}/accept:
    post:
      summary: Accept friend request
      tags: [Friend Requests]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: senderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Friend request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid senderId, or accepting your own request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Friend request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /friend-requests/{senderId}/decline:
    post:
      summary: Decline friend request
      tags: [Friend Requests]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: senderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Friend request declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid senderId, or declining your own request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Friend request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------- Leaderboard
  /leaderboard:
    get:
      summary: Get leaderboard
      description: >
        Top entries by spot score plus the calling user's own standing, including movement
        relative to the latest rank snapshot.
      tags: [Leaderboard]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          description: Coerced into 1..200
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponseDTO'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  # ---------------------------------------------------------------- Activity
  /activity:
    get:
      summary: Get activity feed
      description: >
        Activity items for the calling user (likes and comments received, rank movement,
        streaks), newest first, plus weekly spot score and today's interaction count.
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          description: Coerced into 1..200
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: timezone
          in: query
          description: IANA zone id used to compute "today" for the interaction count
          schema:
            type: string
            example: Europe/Bucharest
      responses:
        '200':
          description: Activity feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponseDTO'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  # ---------------------------------------------------------------- Feedback
  /feedback/user:
    post:
      summary: Submit user feedback
      description: >
        Submits a category-driven feedback item (bug report, confusion, feature idea, or
        general feedback) from the Settings feedback form. Idempotent on `clientFeedbackId`:
        resubmitting the same id is accepted as a no-op and returns 200 with
        `status: already_submitted`. Unlike `/feedback/first-post`, repeated submissions with
        different `clientFeedbackId` values are allowed. When `includeDiagnostics` is `false`,
        the server discards `appVersion`, `androidVersion`, `deviceModel`, `connectionType`,
        and `lastErrorCode` even if the client sent them.
      tags: [Feedback]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitUserFeedbackRequest'
      responses:
        '201':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFeedbackResponse'
        '200':
          description: Already submitted (idempotent on clientFeedbackId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFeedbackResponse'
        '400':
          description: Invalid category/rating combination or missing required message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------- Admin
  /admin/challenges:
    post:
      summary: Create a challenge (admin)
      description: >
        Creates a challenge in `DRAFT`. `startsAtLocal`/`endsAtLocal` are the admin's local
        wall-clock values (no offset, e.g. `2026-08-08T09:00:00`); `timezone` is a strict IANA
        zone name — an invalid or blank value is rejected (400), never silently defaulted to
        UTC. Requires a JWT with the `isAdmin` claim.
      tags: [Challenges, Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChallengeAdminRequest'
      responses:
        '201':
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeAdminDTO'
        '400':
          description: Invalid request (bad timezone, non-positive thresholds, endsAt before startsAt, unknown targetFamilyId, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List challenges (admin)
      description: >
        Keyset-paginated, newest-created first. `status`, when given, filters by *effective*
        lifecycle state (`DRAFT`/`SCHEDULED`/`ACTIVE`/`ENDED`/`CANCELLED`) — not the persisted
        `ChallengeStatus`, which alone can't distinguish `ACTIVE` from a not-yet-started
        `SCHEDULED` challenge. `cursorCreatedAt`/`cursorId` must both come from a previous
        response's `nextCursor`, or both be omitted for the first page. Requires a JWT with the
        `isAdmin` claim.
      tags: [Challenges, Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: cursorCreatedAt
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cursorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EffectiveChallengeStatus'
      responses:
        '200':
          description: One page of challenges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeAdminPageDTO'
        '400':
          description: Invalid limit, cursor, or status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Replace a DRAFT challenge's fields (admin)
      description: >
        Full-field edit — every field `POST /admin/challenges` accepts, revalidated the same
        way (timezone, window, thresholds, target family existence). Permitted only while the
        challenge is still `DRAFT`; rejected with 409 once published (even if since cancelled).
        Requires a JWT with the `isAdmin` claim.
      tags: [Challenges, Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChallengeAdminRequest'
      responses:
        '200':
          description: Updated challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeAdminDTO'
        '400':
          description: Invalid id, bad timezone, non-positive thresholds, endsAt before startsAt, unknown targetFamilyId, ...
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Challenge is no longer DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/challenges/{id}:
    get:
      summary: Challenge detail (admin)
      description: Requires a JWT with the `isAdmin` claim.
      tags: [Challenges, Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPath'
      responses:
        '200':
          description: Challenge detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeAdminDTO'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Edit title/description (admin)
      description: >
        Only `title`/`description` can be edited, and only while the challenge is not
        `CANCELLED`. Every other field (target family, thresholds, window) is frozen once a
        challenge is published, so a completion isn't retroactively made in/eligible with
        nothing to re-evaluate it. Requires a JWT with the `isAdmin` claim.
      tags: [Challenges, Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChallengeTitleRequest'
      responses:
        '200':
          description: Updated challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeAdminDTO'
        '400':
          description: Invalid id, blank title, or missing/invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Challenge is CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/challenges/{id}/publish:
    post:
      summary: Publish a challenge (admin)
      description: >
        `DRAFT` -> `SCHEDULED`. Rejected with 409 if the window overlaps another `SCHEDULED`
        challenge (only one may be scheduled at a time). Requires a JWT with the `isAdmin` claim.
      tags: [Challenges, Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPath'
      responses:
        '200':
          description: Published challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeAdminDTO'
        '400':
          description: Invalid id, or challenge is not DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Window overlaps another SCHEDULED challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/challenges/{id}/cancel:
    post:
      summary: Cancel a challenge (admin)
      description: >
        Normal cancellation: only while the challenge hasn't ended yet. Sets status to
        `CANCELLED` and revokes every already-granted reward for it (idempotent — cancelling
        twice just re-runs a no-op revoke pass). Once a challenge has ended, use
        `/revoke-all` instead. Requires a JWT with the `isAdmin` claim.
      tags: [Challenges, Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPath'
      responses:
        '200':
          description: Number of rewards revoked by this call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeResultDTO'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Challenge has already ended; use /revoke-all instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/challenges/{id}/revoke-all:
    post:
      summary: Retroactively revoke all rewards (admin)
      description: >
        Remediation for a misconfigured challenge discovered after it ended: revokes every
        granted reward regardless of `endsAt`, idempotently, without changing the challenge's
        status or deleting any audit history. `confirmChallengeId` in the body must repeat the
        path id as an explicit confirmation barrier. Requires a JWT with the `isAdmin` claim.
      tags: [Challenges, Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAllRequest'
      responses:
        '200':
          description: Number of rewards revoked by this call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeResultDTO'
        '400':
          description: Invalid id, missing body, or confirmChallengeId doesn't match the path id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/car-families:
    get:
      summary: List car families (admin)
      description: Requires a JWT with the `isAdmin` claim.
      tags: [Car Families, Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All car families
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarFamilyAdminDTO'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a car family (admin)
      description: >
        E.g. `(brand: "Volkswagen", name: "Golf")`. Rejects a duplicate `(brand, name)` pair.
        Requires a JWT with the `isAdmin` claim.
      tags: [Car Families, Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCarFamilyRequest'
      responses:
        '201':
          description: Car family created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarFamilyAdminDTO'
        '400':
          description: Blank brand/name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A car family with this brand/name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/car-families/{id}/models:
    post:
      summary: Assign car models to a family (admin)
      description: >
        Links one or more existing `car_models` rows to a family. All-or-nothing: if any
        requested id doesn't exist, belongs to a different brand than the family, or is already
        linked to a *different* family, NOTHING is assigned — not even the otherwise-valid ids
        — so the request can be fixed and resubmitted as a whole. A model already linked to
        this same family is a no-op (idempotent, safe to retry). On success, returns every
        model now linked to the family. Requires a JWT with the `isAdmin` claim.
      tags: [Car Families, Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CarFamilyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCarModelsRequest'
      responses:
        '200':
          description: The family's models after assignment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarModelOption'
        '400':
          description: Invalid id, empty carModelIds, a car model id that doesn't exist, or a brand mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Car family not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: One or more car models are already linked to a different family
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/car-models/unassigned:
    get:
      summary: Car models not yet linked to a family (admin)
      description: >
        Helps an admin build a new family without guessing catalogue spellings. Requires a
        JWT with the `isAdmin` claim.
      tags: [Car Families, Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: brand
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unassigned models for the brand
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarModelOption'
        '400':
          description: Missing brand parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/reports:
    get:
      summary: List reports by status (admin)
      description: >
        Defaults to `PENDING` (the moderation queue) when `status` is omitted. Requires a
        JWT with the `isAdmin` claim.
      tags: [Reports, Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReportStatus'
      responses:
        '200':
          description: Reports with the given status, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportAdminDTO'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/reports/{id}/resolve:
    post:
      summary: Resolve a report (admin)
      description: >
        `UPHOLD` takes the reported post down (reversing its points and any challenge reward)
        and marks the report `REVIEWED`; `DISMISS` marks it `DISMISSED` without touching the
        post. Idempotent: resolving an already-resolved report just returns its current state.
        Requires a JWT with the `isAdmin` claim.
      tags: [Reports, Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportRequest'
      responses:
        '200':
          description: Resolved report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAdminDTO'
        '400':
          description: Invalid id or missing body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/leaderboard/snapshot:
    post:
      summary: Snapshot leaderboard ranks (operator)
      description: >
        Writes a rank snapshot for today in the configured snapshot zone. Authenticated with
        the `X-Admin-Token` header (`ADMIN_SNAPSHOT_TOKEN`), not a JWT. Idempotent: the
        snapshot for a date is deleted and reinserted, so retries never duplicate rows.
      tags: [Admin]
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Snapshot written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResultDTO'
        '401':
          description: Invalid or missing admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/leaderboard/snapshot/today:
    post:
      summary: Snapshot leaderboard ranks (cron)
      description: >
        Same behaviour as `/admin/leaderboard/snapshot`, but authenticated with the
        `X-Cron-Secret` header (`CRON_SECRET`) so the external daily scheduler uses a secret
        distinct from the human-operated endpoint.
      tags: [Admin]
      security: [{ cronSecret: [] }]
      responses:
        '200':
          description: Snapshot written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResultDTO'
        '401':
          description: Invalid or missing cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token with `sid`/`ver` session claims
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
    cronSecret:
      type: apiKey
      in: header
      name: X-Cron-Secret

  parameters:
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostIdPath:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChallengeIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CarFamilyIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    AuthUnauthorized:
      description: >
        Access token missing, invalid, expired, or its session was revoked
        (`ACCESS_TOKEN_MISSING`, `ACCESS_TOKEN_INVALID`, `ACCESS_TOKEN_EXPIRED`,
        `SESSION_REVOKED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ------------------------------------------------------------- shared
    ErrorResponse:
      type: object
      description: Generic error envelope used by non-auth routes.
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    AuthErrorCode:
      type: string
      enum:
        - ACCESS_TOKEN_EXPIRED
        - ACCESS_TOKEN_INVALID
        - ACCESS_TOKEN_MISSING
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_EXPIRED
        - REFRESH_TOKEN_REUSED
        - REFRESH_TOKEN_CONSUMED
        - SESSION_REVOKED
        - SIGNED_IN_ON_ANOTHER_DEVICE
        - INVALID_CREDENTIALS
        - PROVIDER_MISMATCH
        - INVALID_GOOGLE_TOKEN
        - EMAIL_TAKEN
        - WEAK_PASSWORD
        - VALIDATION_ERROR
        - USERNAME_TAKEN
        - PROFILE_EXISTS
        - ONBOARDING_REQUIRED
        - ACCOUNT_NOT_FOUND
        - ACCOUNT_DELETED
        - INVALID_CURRENT_PASSWORD
        - PROVIDER_NOT_REGULAR
        - USERNAME_CONFIRMATION_MISMATCH

    AuthErrorResponse:
      type: object
      description: >
        Machine-readable auth error. The Android client keys token-refresh and forced-logout
        behaviour off `error.code`, so codes must stay stable.
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/AuthErrorCode'
            message:
              type: string
          required: [code, message]
      required: [error]

    ProfileErrorCode:
      type: string
      enum:
        - FULL_NAME_ALREADY_CHANGED
        - COUNTRY_ALREADY_CHANGED
        - BIRTH_DATE_ALREADY_CHANGED
        - USERNAME_CHANGE_TOO_SOON
        - PHONE_NUMBER_CHANGE_TOO_SOON

    ProfileErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ProfileErrorCode'
            message:
              type: string
          required: [code, message]
      required: [error]

    AuthProvider:
      type: string
      enum: [GOOGLE, REGULAR]

    OnboardingStep:
      type: string
      enum: [PROFILE_REQUIRED, COMPLETED]

    SessionScope:
      type: string
      enum: [ONBOARDING, FULL]

    # ------------------------------------------------------------- auth
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Required for `REGULAR`; ignored for `GOOGLE`
        password:
          type: string
          description: >
            Required for `REGULAR`. At least 8 characters with uppercase, lowercase, digit
            and special character.
        provider:
          $ref: '#/components/schemas/AuthProvider'
        googleIdToken:
          type: string
          description: Required for `GOOGLE`
        deviceId:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
      required: [provider]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        googleIdToken:
          type: string
        provider:
          $ref: '#/components/schemas/AuthProvider'
        deviceId:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
      required: [provider]

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string
          nullable: true
      required: [refreshToken]

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access-token lifetime in seconds
        scope:
          $ref: '#/components/schemas/SessionScope'
        onboardingStep:
          $ref: '#/components/schemas/OnboardingStep'
      required: [accessToken, refreshToken, expiresIn, scope, onboardingStep]

    SessionDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        deviceId:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
      required:
        - id
        - current
        - createdAt
        - lastUsedAt
        - idleExpiresAt
        - absoluteExpiresAt

    UpdatePasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
      required: [oldPassword, newPassword]

    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          nullable: true
          description: Required for `REGULAR` accounts
        usernameConfirmation:
          type: string
          nullable: true
          description: Required for `GOOGLE` accounts
        reason:
          type: string
          nullable: true
        details:
          type: string
          nullable: true

    DeletionContextDTO:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/AuthProvider'
        postCount:
          type: integer
        likesReceived:
          type: integer
        leaderboardRank:
          type: integer
          nullable: true
        streakDays:
          type: integer
        accountAgeDays:
          type: integer
      required:
        - provider
        - postCount
        - likesReceived
        - streakDays
        - accountAgeDays

    # ------------------------------------------------------------- users
    CreateUserRequest:
      type: object
      properties:
        profilePicturePath:
          type: string
          nullable: true
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
        username:
          type: string
        country:
          type: string
      required: [fullName, birthDate, username, country]

    CreateUserResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        userId:
          type: string
          format: uuid
      required: [accessToken, refreshToken, userId]

    UpdateUserRequest:
      type: object
      description: Partial update; omitted fields are left unchanged.
      properties:
        fullName:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true

    UpdateProfilePictureRequest:
      type: object
      properties:
        imagePath:
          type: string
      required: [imagePath]

    UsernameAvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean
        normalized:
          type: string
        reason:
          type: string
          nullable: true
      required: [available, normalized]

    UserDTO:
      type: object
      description: Public profile.
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        profilePicturePath:
          type: string
          nullable: true
          description: Resolved image URL
        username:
          type: string
        country:
          type: string
        spotScore:
          type: integer
        postCount:
          type: integer
        isEarlySpotter:
          type: boolean
        earlySpotterNumber:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        streakDays:
          type: integer
      required: [id, fullName, username, country]

    SelfUserDTO:
      type: object
      description: >
        Own profile. Adds private fields (`phoneNumber`, `birthDate`) and the
        `canChange*` / `next*ChangeAt` flags that drive the edit-profile UI.
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        profilePicturePath:
          type: string
          nullable: true
        username:
          type: string
        country:
          type: string
        phoneNumber:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
        spotScore:
          type: integer
        postCount:
          type: integer
        isEarlySpotter:
          type: boolean
        earlySpotterNumber:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        streakDays:
          type: integer
        canChangeFullName:
          type: boolean
        canChangeCountry:
          type: boolean
        canChangeBirthDate:
          type: boolean
        canChangeUsername:
          type: boolean
        canChangePhoneNumber:
          type: boolean
        nextUsernameChangeAt:
          type: string
          format: date-time
          nullable: true
        nextPhoneNumberChangeAt:
          type: string
          format: date-time
          nullable: true
      required: [id, fullName, username, country, birthDate]

    # ------------------------------------------------------------- posts
    CreatePostMetadata:
      type: object
      description: JSON `metadata` part of the create-post multipart request.
      properties:
        carModelId:
          type: string
          format: uuid
          nullable: true
          description: Catalogue model id; omit when using `customBrand`/`customModel`
        customBrand:
          type: string
          nullable: true
        customModel:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        town:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        source:
          type: string
          description: Capture source; unrecognised values fall back to `GALLERY`
          enum: [CAMERA, GALLERY]
        createdAtTimezone:
          type: string
          nullable: true
          description: IANA zone id of the capture, used for streak/day bucketing

    UpdatePostRequest:
      type: object
      properties:
        carModelId:
          type: string
          format: uuid
          nullable: true
        customBrand:
          type: string
          nullable: true
        customModel:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true

    PostDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        username:
          type: string
        authorProfilePictureUrl:
          type: string
          nullable: true
        carModelId:
          type: string
          format: uuid
          nullable: true
        brand:
          type: string
        model:
          type: string
        imageUrl:
          type: string
        caption:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        town:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        likeCount:
          type: integer
          format: int64
        commentCount:
          type: integer
          format: int64
        likedByCurrentUser:
          type: boolean
        authorIsEarlySpotter:
          type: boolean
        authorEarlySpotterNumber:
          type: integer
          nullable: true
      required: [id, userId, username, brand, model, imageUrl, createdAt]

    FeedCursorDTO:
      type: object
      description: >
        Opaque keyset cursor pointing at the last post of the current page. The next request
        returns posts strictly older than this `(createdAt, id)` pair.
      properties:
        lastCreatedAt:
          type: string
          format: date-time
        lastPostId:
          type: string
          format: uuid
      required: [lastCreatedAt, lastPostId]

    FeedResponseDTO:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/PostDTO'
        nextCursor:
          allOf:
            - $ref: '#/components/schemas/FeedCursorDTO'
          nullable: true
        hasMore:
          type: boolean
      required: [posts, hasMore]

    # ------------------------------------------------------------- comments
    CommentRequest:
      type: object
      properties:
        commentText:
          type: string
      required: [commentText]

    CommentDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        username:
          type: string
        profilePicturePath:
          type: string
          nullable: true
          description: Resolved image URL
        commentText:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, postId, username, commentText, createdAt, updatedAt]

    # ------------------------------------------------------------- likes
    LikeStatusDTO:
      type: object
      properties:
        liked:
          type: boolean
          description: Whether the calling user has liked the post; `false` when anonymous
        count:
          type: integer
          format: int64
      required: [liked, count]

    # ------------------------------------------------------------- reports
    ReportReason:
      type: string
      enum:
        - INCORRECT_CAR_MODEL
        - DUPLICATE_POST
        - INAPPROPRIATE_CONTENT

    ReportRequestDTO:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/ReportReason'
      required: [reason]

    ReportStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [reported, already_reported]
      required: [status]

    # ------------------------------------------------------------- user cars
    UserCarRequest:
      type: object
      description: JSON `metadata` part of the create-car multipart request.
      properties:
        carModelId:
          type: string
          format: uuid
          nullable: true
        customBrand:
          type: string
          nullable: true
        customModel:
          type: string
          nullable: true

    UserCarUpdateRequest:
      type: object
      description: JSON `metadata` part of the update-car multipart request.
      properties:
        carModelId:
          type: string
          format: uuid
          nullable: true
        customBrand:
          type: string
          nullable: true
        customModel:
          type: string
          nullable: true

    UserCarDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        carModelId:
          type: string
          format: uuid
          nullable: true
        brand:
          type: string
        model:
          type: string
        imageUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, brand, model, imageUrl, createdAt, updatedAt]

    # ------------------------------------------------------------- car models
    CarModelOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        model:
          type: string
      required: [id, model]

    # ------------------------------------------------------------- friends
    FriendDTO:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        friendId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          nullable: true
      required: [userId, friendId]

    FriendRequestDTO:
      type: object
      properties:
        senderId:
          type: string
          format: uuid
        receiverId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          nullable: true
      required: [senderId, receiverId]

    # ------------------------------------------------------------- leaderboard
    LeaderboardEntryDTO:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        rank:
          type: integer
        username:
          type: string
        avatarUrl:
          type: string
          nullable: true
        spotScore:
          type: integer
        streakDays:
          type: integer
      required: [userId, rank, username, spotScore, streakDays]

    CurrentUserStandingDTO:
      type: object
      properties:
        entry:
          $ref: '#/components/schemas/LeaderboardEntryDTO'
        movement:
          type: string
          description: Direction of movement since the last rank snapshot
        placesMoved:
          type: integer
      required: [entry, movement, placesMoved]

    LeaderboardResponseDTO:
      type: object
      properties:
        currentUser:
          $ref: '#/components/schemas/CurrentUserStandingDTO'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntryDTO'
      required: [currentUser, entries]

    SnapshotResultDTO:
      type: object
      properties:
        snapshotDate:
          type: string
          format: date
        rowsWritten:
          type: integer
      required: [snapshotDate, rowsWritten]

    # ------------------------------------------------------------- activity
    ActivityItemDTO:
      type: object
      description: >
        Flat activity item discriminated by `type`. Fields not relevant to a given type are
        null. `id` carries a type prefix (e.g. `like:<uuid>`) so it is unique and stable as a
        list key.
      properties:
        type:
          type: string
        id:
          type: string
        actorUserId:
          type: string
          format: uuid
          nullable: true
        actorUsername:
          type: string
          nullable: true
        actorAvatarUrl:
          type: string
          nullable: true
        postId:
          type: string
          format: uuid
          nullable: true
        postThumbnailUrl:
          type: string
          nullable: true
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        commentText:
          type: string
          nullable: true
        placesMoved:
          type: integer
          nullable: true
        streakDays:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [type, id, createdAt]

    ActivityResponseDTO:
      type: object
      properties:
        weeklySpotScore:
          type: integer
        todayInteractions:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItemDTO'
      required: [weeklySpotScore, todayInteractions, items]

    # ------------------------------------------------------------- feedback
    FeedbackCategory:
      type: string
      enum: [NOT_WORKING, CONFUSING, FEATURE_IDEA, GENERAL]

    FeedbackArea:
      type: string
      enum:
        - POSTING
        - FEED
        - PROFILE
        - ACTIVITY
        - LEADERBOARD
        - SETTINGS
        - AUTHENTICATION
        - NAVIGATION
        - NEW_AREA
        - NOT_SURE
        - OTHER

    FeedbackPriority:
      type: string
      enum: [NICE_TO_HAVE, IMPORTANT, BLOCKING]

    ConfusionReason:
      type: string
      enum:
        - DIDNT_KNOW_WHAT_TO_DO_NEXT
        - WORDING_NOT_CLEAR
        - COULDNT_FIND_SOMETHING
        - UNEXPECTED_RESULT
        - TOO_MUCH_INFORMATION
        - OTHER

    FeedbackSource:
      type: string
      enum: [SETTINGS_FEEDBACK, FIRST_POST_PROMPT]

    SubmitUserFeedbackRequest:
      type: object
      description: >
        `message` is required except for `GENERAL` feedback submitted with both `rating` and
        `quickReason`. For `NOT_WORKING`, `message` is always required.
      properties:
        category:
          $ref: '#/components/schemas/FeedbackCategory'
        area:
          $ref: '#/components/schemas/FeedbackArea'
          nullable: true
        message:
          type: string
          nullable: true
        secondaryMessage:
          type: string
          nullable: true
        quickReason:
          $ref: '#/components/schemas/ConfusionReason'
          nullable: true
        priority:
          $ref: '#/components/schemas/FeedbackPriority'
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        keepMessage:
          type: string
          nullable: true
        improveMessage:
          type: string
          nullable: true
        source:
          $ref: '#/components/schemas/FeedbackSource'
        originScreen:
          type: string
          nullable: true
        includeDiagnostics:
          type: boolean
          default: false
        appVersion:
          type: string
          nullable: true
        androidVersion:
          type: string
          nullable: true
        deviceModel:
          type: string
          nullable: true
        connectionType:
          type: string
          nullable: true
        lastErrorCode:
          type: string
          nullable: true
        clientFeedbackId:
          type: string
          format: uuid
          description: Client-generated id used for idempotent resubmission.
        clientSubmittedAt:
          type: string
          format: date-time
          nullable: true
      required: [category, source, clientFeedbackId]

    UserFeedbackResponse:
      type: object
      properties:
        status:
          type: string
          enum: [recorded, already_submitted]
      required: [status]

    # ------------------------------------------------------------- car families
    CarFamilyAdminDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brand:
          type: string
        name:
          type: string
      required: [id, brand, name]

    CreateCarFamilyRequest:
      type: object
      properties:
        brand:
          type: string
        name:
          type: string
      required: [brand, name]

    AssignCarModelsRequest:
      type: object
      properties:
        carModelIds:
          type: array
          items:
            type: string
            format: uuid
      required: [carModelIds]

    # ------------------------------------------------------------- challenges
    ChallengeStatus:
      type: string
      description: Persisted lifecycle state. ACTIVE/ENDED are derived from starts_at/ends_at, not stored.
      enum:
        - DRAFT
        - SCHEDULED
        - CANCELLED

    EffectiveChallengeStatus:
      type: string
      description: >
        Derived lifecycle state used for filtering GET /admin/challenges — DRAFT/CANCELLED map
        1:1 to the persisted status; SCHEDULED/ACTIVE/ENDED further split a persisted SCHEDULED
        challenge by whether `now` is before its window, inside it, or after it.
      enum:
        - DRAFT
        - SCHEDULED
        - ACTIVE
        - ENDED
        - CANCELLED

    ChallengeDTO:
      type: object
      description: Public-facing challenge config, no admin/audit fields.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        targetFamilyBrand:
          type: string
        targetFamilyName:
          type: string
        requiredPosts:
          type: integer
        rewardPoints:
          type: integer
        startsAt:
          type: string
          format: date-time
          description: UTC instant. Client converts to the viewer's own timezone for display.
        endsAt:
          type: string
          format: date-time
      required: [id, title, targetFamilyBrand, targetFamilyName, requiredPosts, rewardPoints, startsAt, endsAt]

    ChallengeContributionDTO:
      type: object
      properties:
        postId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        imageUrl:
          type: string
          nullable: true
          description: Resolved, directly loadable URL — not a raw storage key. Absent on clients built before this field existed.
        carBrand:
          type: string
          nullable: true
          description: The car model captured at contribution time, not the post's current one if it was later edited.
        carModel:
          type: string
          nullable: true
      required: [postId, createdAt]

    ChallengeProgressDTO:
      type: object
      description: The viewer's own progress on one challenge.
      properties:
        contributionCount:
          type: integer
        rewardState:
          type: string
          enum: [NONE, GRANTED]
      required: [contributionCount, rewardState]

    CurrentChallengeDTO:
      type: object
      description: Response for GET /challenges/current. Both fields null when no challenge is scheduled.
      properties:
        challenge:
          allOf:
            - $ref: '#/components/schemas/ChallengeDTO'
          nullable: true
        progress:
          allOf:
            - $ref: '#/components/schemas/ChallengeProgressDTO'
          nullable: true

    ChallengeProgressDetailDTO:
      type: object
      description: Response for GET /challenges/{id}/progress.
      properties:
        progress:
          $ref: '#/components/schemas/ChallengeProgressDTO'
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/ChallengeContributionDTO'
      required: [progress, contributions]

    ChallengeSummaryDTO:
      type: object
      description: The caller's lifetime challenge participation.
      properties:
        joinedCount:
          type: integer
        completedCount:
          type: integer
          description: Currently holds the completion reward (reward_state = GRANTED), not "completed at some point".
        pointsEarned:
          type: integer
          description: Net of every grant/revoke, from the reward ledger — not rewardPoints * completedCount.
        totalContributions:
          type: integer
      required: [joinedCount, completedCount, pointsEarned, totalContributions]

    ChallengeHistoryItemDTO:
      type: object
      description: One row of GET /challenges/me — a challenge the caller participated in, plus their progress on it.
      properties:
        challenge:
          $ref: '#/components/schemas/ChallengeDTO'
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveChallengeStatus'
        progress:
          $ref: '#/components/schemas/ChallengeProgressDTO'
      required: [challenge, effectiveStatus, progress]

    MyChallengesDTO:
      type: object
      description: Response for GET /challenges/me.
      properties:
        summary:
          allOf:
            - $ref: '#/components/schemas/ChallengeSummaryDTO'
          nullable: true
          description: Present only on the first page (no cursor given).
        challenges:
          type: array
          items:
            $ref: '#/components/schemas/ChallengeHistoryItemDTO'
        hasMore:
          type: boolean
        nextCursorEndsAt:
          type: string
          format: date-time
          nullable: true
        nextCursorId:
          type: string
          format: uuid
          nullable: true
      required: [challenges, hasMore]

    CreateChallengeAdminRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        targetFamilyId:
          type: string
          format: uuid
        requiredPosts:
          type: integer
        rewardPoints:
          type: integer
        startsAtLocal:
          type: string
          description: Local (no offset) ISO-8601 date-time, e.g. "2026-08-08T09:00:00" — the admin's wall clock.
        endsAtLocal:
          type: string
        timezone:
          type: string
          description: IANA zone, e.g. "Europe/Bucharest". Rejected (400) if blank or unrecognized — never silently defaulted.
      required: [title, targetFamilyId, requiredPosts, rewardPoints, startsAtLocal, endsAtLocal, timezone]

    UpdateChallengeTitleRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
      required: [title]

    RevokeAllRequest:
      type: object
      properties:
        confirmChallengeId:
          type: string
          format: uuid
          description: Must repeat the path id — confirmation barrier for a retroactive mass revoke.
      required: [confirmChallengeId]

    RevokeResultDTO:
      type: object
      properties:
        revokedCount:
          type: integer
      required: [revokedCount]

    ChallengeAdminDTO:
      type: object
      description: Full admin view of a challenge, including lifecycle/audit fields.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        targetFamilyId:
          type: string
          format: uuid
        requiredPosts:
          type: integer
        rewardPoints:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        adminTimezone:
          type: string
          description: Informational only — never used to evaluate eligibility.
        status:
          $ref: '#/components/schemas/ChallengeStatus'
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
      required: [id, title, targetFamilyId, requiredPosts, rewardPoints, startsAt, endsAt, adminTimezone, status, createdAt, updatedAt]

    ChallengeListCursorDTO:
      type: object
      description: Opaque keyset cursor for GET /admin/challenges — echo both fields back as query params to fetch the next page.
      properties:
        lastCreatedAt:
          type: string
          format: date-time
        lastChallengeId:
          type: string
          format: uuid
      required: [lastCreatedAt, lastChallengeId]

    ChallengeAdminPageDTO:
      type: object
      properties:
        challenges:
          type: array
          items:
            $ref: '#/components/schemas/ChallengeAdminDTO'
        nextCursor:
          allOf:
            - $ref: '#/components/schemas/ChallengeListCursorDTO'
          nullable: true
        hasMore:
          type: boolean
      required: [challenges, hasMore]

    # ------------------------------------------------------------- reports (admin)
    ReportStatus:
      type: string
      enum: [PENDING, REVIEWED, DISMISSED]

    ModerationDecision:
      type: string
      enum: [UPHOLD, DISMISS]

    ResolveReportRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/ModerationDecision'
      required: [decision]

    ReportAdminDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ReportReason'
        status:
          $ref: '#/components/schemas/ReportStatus'
        createdAt:
          type: string
          format: date-time
      required: [id, reporterId, postId, reason, status, createdAt]
